<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Raw Materials</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}">Header</div>
<main class="page">
    <div class="page-header">
        <div>
            <p class="eyebrow">Catalogue</p>
            <h1>Raw materials</h1>
        </div>
        <a class="button" sec:authorize="hasAuthority('BIO_ENGINEER')" th:href="@{/raw-materials/new}">
            Register new raw material
        </a>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Organic</th>
            <th>Amount</th>
            <th>Price</th>
            <th>Unit</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(rawMaterials)}">
            <td colspan="7">No raw materials have been registered yet.</td>
        </tr>
        <tr th:each="rawMaterial : ${rawMaterials}">
            <td th:text="${rawMaterial.code}"></td>
            <td th:text="${rawMaterial.name}"></td>
            <td th:text="${rawMaterial.organicCertified ? 'Yes' : 'No'}"></td>
            <td th:text="${#numbers.formatDecimal(rawMaterial.amount, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(rawMaterial.price, 1, 2)}"></td>
            <td th:text="${rawMaterial.unit}"></td>
            <td class="actions">
                <a th:href="@{/raw-materials/{id}(id=${rawMaterial.id})}">Details</a>
                <a sec:authorize="hasAuthority('BIO_ENGINEER')"
                   th:href="@{/raw-materials/{id}/edit(id=${rawMaterial.id})}">Edit</a>
                <form sec:authorize="hasAuthority('BIO_ENGINEER')"
                      th:action="@{/raw-materials/{id}/delete(id=${rawMaterial.id})}" method="post">
                    <button type="submit" class="link-button">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer :: footer}">Footer</div>
</body>
</html>
